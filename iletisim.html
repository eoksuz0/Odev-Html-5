        <h1>Bizimle İletişime Geçin</h1>
        <p>Proje Detaylarınız Konuşup,Sorunlarını çözelim</p>

       
        <form action="#" method="post">
            <fieldset>

                <legend>Projeniz Hakkında Konuşulur</legend>
                <br>
                <div>
                    <label for="name">Ad-Soyad</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <br><br>

                <div>
                    <label for="Mail">E-Mail</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <br><br>

                <div>
                    <label for="message">İstekleriniz</label> <br>
                    <textarea name="message" id="message" rows="6" cols="30" required></textarea>
                </div>

                <label for="dosya">Örnek Site Görseli</label>
                <input type="file" id="dosya" name="dosya" accept=".pdf, .jpeg">
                <button>Yükle</button>
                <button type="submit">Gönder</button>
            </fieldset>
        </form>
